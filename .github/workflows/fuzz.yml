name: Fuzz

# Coverage-guided fuzzing of document parsers and bundle import with SharpFuzz and libFuzzer.
# Long campaigns are started by hand. Pull requests that touch the harness run a short smoke campaign.
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Fuzzing time per target, in seconds
        required: false
        default: "1800"
  pull_request:
    paths:
      - tests/Protocol.Fuzz/**
      - .github/workflows/fuzz.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SHARPFUZZ_VERSION: 2.3.0
  LIBFUZZER_DOTNET_URL: https://github.com/Metalnem/libfuzzer-dotnet/releases/download/v2025.05.02.0904/libfuzzer-dotnet-ubuntu
  LIBFUZZER_DOTNET_SHA256: c2c2a90d94c409a4af339a0d4f244e0442c5a5d249be0f1252ba07871f285958

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [canonical, evidence, document, delivery-index, payloads, line-ranges, bundle, bundle-zip]
    env:
      FUZZ_SECONDS: ${{ github.event.inputs.seconds || '120' }}
      FUZZ_TARGET: ${{ matrix.target }}
      FUZZ_FINDINGS: ${{ github.workspace }}/.fuzz/findings
      FUZZ_CORPUS: ${{ github.workspace }}/.fuzz/corpus
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Build and instrument harness
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/sharpfuzz" SharpFuzz.CommandLine --version "$SHARPFUZZ_VERSION"
          dotnet publish tests/Protocol.Fuzz/Protocol.Fuzz.csproj --configuration Release --output "$RUNNER_TEMP/fuzz"
          "$RUNNER_TEMP/sharpfuzz/sharpfuzz" "$RUNNER_TEMP/fuzz/Diffra.Protocol.dll"

      - name: Download libfuzzer-dotnet
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/libfuzzer-dotnet" "$LIBFUZZER_DOTNET_URL"
          echo "$LIBFUZZER_DOTNET_SHA256  $RUNNER_TEMP/libfuzzer-dotnet" | sha256sum --check
          chmod +x "$RUNNER_TEMP/libfuzzer-dotnet"

      - name: Seed corpus
        run: dotnet "$RUNNER_TEMP/fuzz/Diffra.Protocol.Fuzz.dll" seed "$FUZZ_CORPUS" "$GITHUB_WORKSPACE"

      - name: Fuzz
        id: fuzz
        continue-on-error: true
        run: |
          mkdir -p "$FUZZ_FINDINGS"
          "$RUNNER_TEMP/libfuzzer-dotnet" \
            -max_total_time="$FUZZ_SECONDS" -timeout=10 -print_final_stats=1 \
            -artifact_prefix="$FUZZ_FINDINGS/libfuzzer-" \
            --target_path=dotnet --target_arg="$RUNNER_TEMP/fuzz/Diffra.Protocol.Fuzz.dll" \
            "$FUZZ_CORPUS/$FUZZ_TARGET" 2>&1 | tee "$RUNNER_TEMP/fuzz.log"
          exit "${PIPESTATUS[0]}"

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Fuzz: $FUZZ_TARGET (${FUZZ_SECONDS}s)"
            echo
            echo "libFuzzer outcome: ${{ steps.fuzz.outcome }}"
            echo
            echo '```text'
            grep -E '^(#[0-9]+.*(DONE|pulse)|stat::|==[0-9]+== ERROR|SUMMARY|INFO: Seed|INFO: .* files found)' "$RUNNER_TEMP/fuzz.log" | tail -n 25 || true
            echo '```'
            echo
            count=$(find "$FUZZ_FINDINGS" -type f | wc -l)
            echo "Finding files: $count"
            for file in "$FUZZ_FINDINGS"/*.txt; do
              [ -e "$file" ] || continue
              echo
              echo "### $(basename "$file" .txt)"
              echo '```text'
              head -n 12 "$file"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Upload findings and corpus
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-${{ matrix.target }}
          path: .fuzz
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail on findings
        run: |
          if [ "${{ steps.fuzz.outcome }}" != "success" ] || [ -n "$(find "$FUZZ_FINDINGS" -name '*.txt' ! -name 'observation-*')" ]; then
            echo "::error::Fuzzing found issues for $FUZZ_TARGET; see the job summary and the fuzz-$FUZZ_TARGET artifact."
            exit 1
          fi
