name: Deep

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      strict:
        description: 'Enforce release-gate constraints (all fuzz targets, full budget). Untick only for ad hoc runs.'
        required: false
        type: boolean
        default: true
      fuzz_seconds:
        description: 'Fuzzing time per target, in seconds (empty means the strict floor)'
        required: false
        default: ''
      target:
        description: 'Fuzz target to run (or "all"); a single target needs strict unticked'
        required: false
        default: 'all'
  # Strictness is deliberately not declared here, and every called run is strict whatever the
  # caller passes or leaks (see the concurrency comment below), so a caller cannot weaken the
  # release gate.
  workflow_call:
    inputs:
      fuzz_seconds:
        description: 'Fuzzing time per target, in seconds (empty means the strict floor; less is rejected)'
        required: false
        type: string
        default: ''
      target:
        description: 'Fuzz target to run; called runs are strict, so anything but "all" is rejected'
        required: false
        type: string
        default: 'all'
    outputs:
      summary-artifact:
        description: 'Name of the deep summary artifact'
        value: 'deep-summary'
      result:
        description: 'Overall result of the deep tier workflow'
        value: ${{ jobs.deep.outputs.result }}
      evidence-verdict:
        description: 'Deep Evidence verdict against the main baseline (pass, warn, needs-review, inconclusive or fail)'
        value: ${{ jobs.deep.outputs.evidence-verdict }}

permissions:
  contents: read

# A run is non-strict only when BOTH hold:
#   1. inputs.strict is literally false, and
#   2. the top-level workflow is this repository's deep.yml (github.workflow_ref).
# Condition 2 is what a caller cannot spoof. Inside a called workflow github.event_name is the
# caller's event, and a dispatched caller's own `strict` input leaks into `inputs` here (shown
# by a probe run), so condition 1 alone is not enough. For a called run, github.workflow_ref
# names the caller's workflow file, never this one. The repository slug is literal on purpose:
# github.repository is the caller's repository, so a foreign repo's own deep.yml must not
# match. A fork therefore always runs strict, which fails safe.
# Non-strict ad hoc runs share one group per ref and replace each other. Every strict run
# (nightly, strict dispatch, workflow_call) gets a group unique to its run_id and is never
# cancelled, so no other run can cancel it or make it wait. The same predicate is repeated in
# the validate job, because workflow-level env is not available here.
concurrency:
  group: ${{ (format('{0}', inputs.strict) == 'false' && startsWith(github.workflow_ref, 'rtkelly-labs/Diffra/.github/workflows/deep.yml@')) && format('deep-adhoc-{0}', github.ref) || format('deep-strict-{0}', github.run_id) }}
  cancel-in-progress: ${{ format('{0}', inputs.strict) == 'false' && startsWith(github.workflow_ref, 'rtkelly-labs/Diffra/.github/workflows/deep.yml@') }}

defaults:
  run:
    shell: bash

env:
  SHARPFUZZ_VERSION: 2.3.0
  LIBFUZZER_DOTNET_URL: https://github.com/Metalnem/libfuzzer-dotnet/releases/download/v2025.05.02.0904/libfuzzer-dotnet-ubuntu
  LIBFUZZER_DOTNET_SHA256: c2c2a90d94c409a4af339a0d4f244e0442c5a5d249be0f1252ba07871f285958
  # Single sources of truth, read by the workflow steps and by scripts/DeepSummary.cs.
  MUTATION_THRESHOLD: "57"
  COMPONENT_MUTATION_FLOOR: "80"
  STRICT_FUZZ_FLOOR_SECONDS: "1800"
  # Upper bound on the per-target budget. The fuzz job has timeout-minutes: 60, and the
  # budget must leave room for setup, the kill grace period and artifact upload.
  MAX_FUZZ_SECONDS: "3000"
  ALL_FUZZ_TARGETS: "canonical evidence document delivery-index payloads line-ranges bundle bundle-zip"
  COVERLET_VERSION: "10.1.0"

jobs:
  # 0. Resolve and validate the run parameters once. Every other job needs this one, so a
  #    rejected run stops here before any runner time is spent.
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      strict: ${{ steps.resolve.outputs.strict }}
      fuzz_seconds: ${{ steps.resolve.outputs.fuzz_seconds }}
      target: ${{ steps.resolve.outputs.target }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve strictness, fuzz budget and fuzz targets
        id: resolve
        env:
          # Same predicate as the concurrency block: non-strict needs strict=false AND a
          # direct run of this repository's deep.yml. A caller can leak `strict` but not
          # github.workflow_ref.
          NON_STRICT: ${{ format('{0}', inputs.strict) == 'false' && startsWith(github.workflow_ref, 'rtkelly-labs/Diffra/.github/workflows/deep.yml@') }}
          STRICT_INPUT: ${{ format('{0}', inputs.strict) }}
          TOP_LEVEL_WORKFLOW: ${{ github.workflow_ref }}
          TARGET_INPUT: ${{ inputs.target }}
          FUZZ_SECONDS_INPUT: ${{ inputs.fuzz_seconds }}
        run: |
          # Anything but an explicit, unspoofable non-strict is strict.
          if [ "$NON_STRICT" = "true" ]; then strict=false; else strict=true; fi

          fuzz_seconds="${FUZZ_SECONDS_INPUT:-$STRICT_FUZZ_FLOOR_SECONDS}"
          if ! [[ "$fuzz_seconds" =~ ^[0-9]{1,6}$ ]]; then
            echo "::error::Invalid fuzz_seconds value: '$fuzz_seconds'. Must be 1 to 6 digits."
            exit 1
          fi
          fuzz_seconds=$((10#$fuzz_seconds))
          if [ "$fuzz_seconds" -le 0 ]; then
            echo "::error::fuzz_seconds must be positive (got $fuzz_seconds)."
            exit 1
          fi
          if [ "$fuzz_seconds" -gt "$MAX_FUZZ_SECONDS" ]; then
            echo "::error::fuzz_seconds must be at most ${MAX_FUZZ_SECONDS}s so the run fits the 60-minute fuzz job timeout (got ${fuzz_seconds}s)."
            exit 1
          fi

          target="${TARGET_INPUT:-all}"
          if [ "$target" != "all" ] && { ! [[ "$target" =~ ^[a-z-]+$ ]] || ! [[ " $ALL_FUZZ_TARGETS " == *" $target "* ]]; }; then
            echo "::error::Unknown fuzz target '$target'. Expected 'all' or one of: $ALL_FUZZ_TARGETS"
            exit 1
          fi

          echo "Resolved: strict=$strict (strict input='${STRICT_INPUT}', top-level workflow='${TOP_LEVEL_WORKFLOW}'), target=$target, fuzz_seconds=$fuzz_seconds, strict floor=${STRICT_FUZZ_FLOOR_SECONDS}s"

          if [ "$strict" = "true" ]; then
            if [ "$target" != "all" ]; then
              echo "::error::Strict mode requires all fuzz targets (got target='$target')."
              exit 1
            fi
            if [ "$fuzz_seconds" -lt "$STRICT_FUZZ_FLOOR_SECONDS" ]; then
              echo "::error::Strict mode requires a fuzz budget of at least ${STRICT_FUZZ_FLOOR_SECONDS}s (got ${fuzz_seconds}s)."
              exit 1
            fi
          fi

          if [ "$target" = "all" ]; then
            targets_json=$(printf '"%s",' $ALL_FUZZ_TARGETS)
            matrix="{\"target\":[${targets_json%,}]}"
          else
            matrix="{\"target\":[\"$target\"]}"
          fi

          {
            echo "strict=$strict"
            echo "fuzz_seconds=$fuzz_seconds"
            echo "target=$target"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"

  # 1. Light platform matrix: native self-contained archive smoke test across five platforms
  platform:
    name: platform (${{ matrix.platform }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            rid: linux-x64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            rid: linux-arm64
          - platform: macos-arm64
            runner: macos-latest
            rid: osx-arm64
          - platform: macos-x64
            runner: macos-15-intel
            rid: osx-x64
          - platform: win-x64
            runner: windows-latest
            rid: win-x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Resolve project version
        id: version
        shell: bash
        run: |
          version=$(dotnet msbuild src/Cli/Diffra.Cli.csproj -getProperty:Version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "DIFFRA_VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish self-contained single-file archive
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          dist_dir="dist/$RID"
          mkdir -p "$dist_dir" artifacts

          dotnet publish src/Cli/Diffra.Cli.csproj \
            --configuration Release \
            -r "$RID" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PublishTrimmed=false \
            -p:PublishAot=false \
            -o "$dist_dir"

          cp LICENSE README.md "$dist_dir/"

          if [ "$RID" = "win-x64" ]; then
            cp "$dist_dir/Diffra.Cli.exe" "$dist_dir/diffra.exe"
            archive_name="diffra-${DIFFRA_VERSION}-${RID}.zip"
            powershell -NoProfile -Command "Compress-Archive -Path '$dist_dir/diffra.exe', '$dist_dir/LICENSE', '$dist_dir/README.md' -DestinationPath 'artifacts/${archive_name}'"
          else
            cp "$dist_dir/Diffra.Cli" "$dist_dir/diffra"
            chmod +x "$dist_dir/diffra"
            archive_name="diffra-${DIFFRA_VERSION}-${RID}.tar.gz"
            tar -czf "artifacts/${archive_name}" -C "$dist_dir" diffra LICENSE README.md
          fi
          echo "ARCHIVE_NAME=$archive_name" >> "$GITHUB_ENV"
          archive_size=$(wc -c < "artifacts/${archive_name}" | tr -d ' ')
          echo "ARCHIVE_SIZE=$archive_size" >> "$GITHUB_ENV"

      - name: Smoke test self-contained archive without .NET on PATH
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p temp/smoke-selfcontained
          smoke_status="failure"

          if [ "$RID" = "win-x64" ]; then
            powershell -NoProfile -Command "Expand-Archive -Path 'artifacts/$ARCHIVE_NAME' -DestinationPath 'temp/smoke-selfcontained'"
            SYSTEMROOT_WIN="${SYSTEMROOT:-C:\\Windows}"
            SYSTEM32_WIN="${SYSTEMROOT_WIN}\\System32"

            echo "=== Child process environment (proof of isolation) ==="
            echo "DOTNET_MULTILEVEL_LOOKUP=0"
            echo "DOTNET_ROOT="
            echo "HOME=$HOME"
            echo "PATH=$SYSTEM32_WIN;$SYSTEMROOT_WIN"
            echo "SystemRoot=$SYSTEMROOT_WIN"
            echo "TEMP=$TEMP"
            echo "TMP=$TMP"
            echo "USERPROFILE=$USERPROFILE"
            echo "WINDIR=$SYSTEMROOT_WIN"

            sc() {
              env -i SystemRoot="$SYSTEMROOT_WIN" WINDIR="$SYSTEMROOT_WIN" USERPROFILE="$USERPROFILE" HOME="$HOME" TEMP="$TEMP" TMP="$TMP" PATH="$SYSTEM32_WIN;$SYSTEMROOT_WIN" DOTNET_ROOT="" DOTNET_MULTILEVEL_LOOKUP=0 "$PWD/temp/smoke-selfcontained/diffra.exe" "$@"
            }
          else
            tar -xzf "artifacts/$ARCHIVE_NAME" -C temp/smoke-selfcontained

            echo "=== Child process environment (proof of isolation) ==="
            echo "DOTNET_ROOT="
            echo "HOME=$HOME"
            echo "PATH=/nonexistent"
            echo "TMPDIR=${TMPDIR:-/tmp}"

            sc() {
              env -i HOME="$HOME" TMPDIR="${TMPDIR:-/tmp}" PATH=/nonexistent DOTNET_ROOT="" "$PWD/temp/smoke-selfcontained/diffra" "$@"
            }
          fi

          echo "Running --help..."
          if sc --help; then
            echo "Running file workflow smoke test..."
            mkdir -p temp/smoke-sc-run
            if sc collect \
                --payload examples/sample-project/workflow/candidate-payload.json \
                --subject-id example/project --commit 2222222222222222222222222222222222222222 \
                --type-id org.example.metrics --type-version 1.0 \
                --producer-id org.example.fixture --producer-version 1.0 \
                -o temp/smoke-sc-run/evidence.json && \
               sc diff \
                --baseline-ref examples/sample-project/workflow/baseline-reference.json \
                --baseline-evidence examples/sample-project/workflow/baseline-evidence.json \
                --evidence temp/smoke-sc-run/evidence.json -o temp/smoke-sc-run/delta.json && \
               sc eval \
                --rules examples/sample-project/workflow/rules.json \
                --delta temp/smoke-sc-run/delta.json -o temp/smoke-sc-run/assessment.json && \
               sc report \
                temp/smoke-sc-run/delta.json --assessment temp/smoke-sc-run/assessment.json \
                --baseline-ref examples/sample-project/workflow/baseline-reference.json \
                --format html -o temp/smoke-sc-run/report.html && \
               test -s temp/smoke-sc-run/evidence.json && \
               test -s temp/smoke-sc-run/delta.json && \
               test -s temp/smoke-sc-run/assessment.json && \
               test -s temp/smoke-sc-run/report.html && \
               jq -e '.environment.tools == []' temp/smoke-sc-run/evidence.json > /dev/null; then
              smoke_status="success"
              echo "Native self-contained archive smoke test succeeded."
            fi
          fi

          echo "SMOKE_STATUS=$smoke_status" >> "$GITHUB_ENV"
          if [ "$smoke_status" != "success" ]; then
            echo "::error::Native self-contained archive smoke test failed for $PLATFORM"
            exit 1
          fi

      # Run regression corpus against extracted native self-contained archive
      # TODO(#114): Switch to quick mode (--quick) once PR #114 lands on main.
      - name: Run regression corpus against native self-contained archive
        env:
          RID: ${{ matrix.rid }}
        run: |
          if [ "$RID" = "win-x64" ]; then
            archive_bin="$PWD/temp/smoke-selfcontained/diffra.exe"
          else
            archive_bin="$PWD/temp/smoke-selfcontained/diffra"
          fi
          dotnet run --project tests/regression/Diffra.Regression.csproj --configuration Release -- --tool "$archive_bin"

      - name: Record platform metadata
        if: always()
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          RUNNER_LABEL: ${{ matrix.runner }}
          RID: ${{ matrix.rid }}
        run: |
          mkdir -p metadata
          cat <<EOF > "metadata/platform-$PLATFORM.json"
          {
            "platform": "$PLATFORM",
            "runner": "$RUNNER_LABEL",
            "rid": "$RID",
            "archiveSmoke": "${SMOKE_STATUS:-failure}",
            "archiveName": "$ARCHIVE_NAME",
            "archiveSizeBytes": $ARCHIVE_SIZE
          }
          EOF
          cat "metadata/platform-$PLATFORM.json"

      - name: Upload platform metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deep-platform-${{ matrix.platform }}
          path: metadata/platform-${{ matrix.platform }}.json
          if-no-files-found: error

  # 2. Unit and packed CLI end-to-end suite (runs once on Linux)
  test:
    name: test (Protocol.Tests & CLI e2e)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Resolve project version
        id: version
        run: |
          version=$(dotnet msbuild src/Cli/Diffra.Cli.csproj -getProperty:Version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "DIFFRA_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build solution
        run: dotnet build Diffra.slnx --configuration Release

      - name: Install coverlet
        run: dotnet tool install coverlet.console --version "$COVERLET_VERSION" --tool-path "$RUNNER_TEMP/coverlet"

      # The suite runs once, under coverlet, so the test count and the coverage come from the
      # same run. Coverage is line and branch coverage of Diffra.Protocol only.
      - name: Run protocol and integration test suite with coverage
        id: unit-tests
        run: |
          set -euo pipefail
          mkdir -p temp
          tests_dll=tests/Protocol.Tests/bin/Release/net10.0/Diffra.Protocol.Tests.dll
          "$RUNNER_TEMP/coverlet/coverlet" "$tests_dll" --target dotnet --targetargs "$tests_dll" \
            --include "[Diffra.Protocol]*" --format cobertura --output temp/coverage.cobertura.xml \
            | tee temp/protocol-tests.log
          test_count=$(grep -c '^PASS ' temp/protocol-tests.log || true)
          if [ -z "$test_count" ] || [ "$test_count" -le 0 ]; then
            echo "::error::No passing tests detected in Protocol.Tests output"
            exit 1
          fi
          echo "TEST_COUNT=$test_count" >> "$GITHUB_ENV"

          coverage_root=$(grep -m1 -o '<coverage [^>]*>' temp/coverage.cobertura.xml)
          attr() { printf '%s' "$coverage_root" | sed -n "s/.* $1=\"\([0-9]*\)\".*/\1/p"; }
          lines_covered=$(attr lines-covered)
          lines_valid=$(attr lines-valid)
          branches_covered=$(attr branches-covered)
          branches_valid=$(attr branches-valid)
          for value in "$lines_covered" "$lines_valid" "$branches_covered" "$branches_valid"; do
            if ! [[ "$value" =~ ^[0-9]+$ ]]; then
              echo "::error::Could not read line and branch counts from the coverage report."
              exit 1
            fi
          done
          echo "COVERAGE_JSON={\"linesCovered\": $lines_covered, \"linesValid\": $lines_valid, \"branchesCovered\": $branches_covered, \"branchesValid\": $branches_valid}" >> "$GITHUB_ENV"
          echo "Diffra.Protocol coverage: lines $lines_covered/$lines_valid, branches $branches_covered/$branches_valid"

      - name: Pack CLI tool package
        id: pack-cli
        run: dotnet pack src/Cli/Diffra.Cli.csproj --configuration Release -o artifacts/package

      - name: Smoke test installed Diffra CLI tool
        id: tool-smoke
        run: |
          dotnet tool install Diffra.Cli --add-source artifacts/package --tool-path runner-bin --version "$DIFFRA_VERSION"
          mkdir -p temp/smoke

          ./runner-bin/diffra collect \
            --payload examples/sample-project/workflow/candidate-payload.json \
            --subject-id example/project --commit 2222222222222222222222222222222222222222 \
            --type-id org.example.metrics --type-version 1.0 \
            --producer-id org.example.fixture --producer-version 1.0 \
            -o temp/smoke/evidence.json
          test $? -eq 0

          ./runner-bin/diffra diff \
            --baseline-ref examples/sample-project/workflow/baseline-reference.json \
            --baseline-evidence examples/sample-project/workflow/baseline-evidence.json \
            --evidence temp/smoke/evidence.json -o temp/smoke/delta.json
          test $? -eq 0

          ./runner-bin/diffra eval \
            --rules examples/sample-project/workflow/rules.json \
            --delta temp/smoke/delta.json -o temp/smoke/assessment.json
          test $? -eq 0

          ./runner-bin/diffra report \
            temp/smoke/delta.json --assessment temp/smoke/assessment.json \
            --baseline-ref examples/sample-project/workflow/baseline-reference.json \
            --format html -o temp/smoke/report.html
          test $? -eq 0

          test -s temp/smoke/evidence.json
          test -s temp/smoke/delta.json
          test -s temp/smoke/assessment.json
          test -s temp/smoke/report.html

      - name: Record test metadata
        if: always()
        env:
          UNIT_TESTS_OUTCOME: ${{ steps.unit-tests.outcome }}
          TOOL_SMOKE_OUTCOME: ${{ steps.tool-smoke.outcome }}
        run: |
          mkdir -p metadata
          pkg_file=$(ls artifacts/package/Diffra.Cli.*.nupkg 2>/dev/null | head -1 || true)
          if [ -n "$pkg_file" ] && [ -f "$pkg_file" ]; then
            pkg_name=$(basename "$pkg_file")
            pkg_size=$(wc -c < "$pkg_file" | tr -d ' ')
            pkg_json="\"$pkg_name\""
          else
            pkg_size="null"
            pkg_json="null"
          fi

          tests_passed=0
          tests_failed=0
          if [ "$UNIT_TESTS_OUTCOME" = "success" ]; then
            tests_passed="${TEST_COUNT:-0}"
            tests_failed=0
          else
            tests_failed=1
          fi

          cat <<EOF > metadata/test-summary.json
          {
            "unitTests": "$UNIT_TESTS_OUTCOME",
            "toolSmoke": "$TOOL_SMOKE_OUTCOME",
            "testsPassed": $tests_passed,
            "testsFailed": $tests_failed,
            "testCount": ${TEST_COUNT:-null},
            "coverage": ${COVERAGE_JSON:-null},
            "packageSizeBytes": $pkg_size,
            "packageName": $pkg_json
          }
          EOF
          cat metadata/test-summary.json

      - name: Upload test metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deep-test-summary
          path: metadata/test-summary.json
          if-no-files-found: error

  fuzz:
    name: fuzz (${{ matrix.target }})
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.validate.outputs.matrix) }}
    env:
      FUZZ_SECONDS: ${{ needs.validate.outputs.fuzz_seconds }}
      FUZZ_TARGET: ${{ matrix.target }}
      FUZZ_FINDINGS: ${{ github.workspace }}/.fuzz/findings
      FUZZ_CORPUS: ${{ github.workspace }}/.fuzz/corpus
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Build and instrument harness
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/sharpfuzz" SharpFuzz.CommandLine --version "$SHARPFUZZ_VERSION"
          dotnet publish tests/Protocol.Fuzz/Protocol.Fuzz.csproj --configuration Release --output "$RUNNER_TEMP/fuzz"
          cp -R "$RUNNER_TEMP/fuzz" "$RUNNER_TEMP/fuzz-plain"
          "$RUNNER_TEMP/sharpfuzz/sharpfuzz" "$RUNNER_TEMP/fuzz/Diffra.Protocol.dll"

      - name: Download libfuzzer-dotnet
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/libfuzzer-dotnet" "$LIBFUZZER_DOTNET_URL"
          echo "$LIBFUZZER_DOTNET_SHA256  $RUNNER_TEMP/libfuzzer-dotnet" | sha256sum --check
          chmod +x "$RUNNER_TEMP/libfuzzer-dotnet"

      - name: Seed corpus
        run: dotnet "$RUNNER_TEMP/fuzz-plain/Diffra.Protocol.Fuzz.dll" seed "$FUZZ_CORPUS" "$GITHUB_WORKSPACE"

      - name: Fuzz
        id: fuzz
        continue-on-error: true
        run: |
          mkdir -p "$FUZZ_FINDINGS"
          set +e
          timeout --kill-after=30 "$((FUZZ_SECONDS + 120))" setsid --wait "$RUNNER_TEMP/libfuzzer-dotnet" \
            -max_total_time="$FUZZ_SECONDS" -timeout=10 -print_final_stats=1 \
            -artifact_prefix="$FUZZ_FINDINGS/libfuzzer-" \
            --target_path=dotnet --target_arg="$RUNNER_TEMP/fuzz/Diffra.Protocol.Fuzz.dll" \
            "$FUZZ_CORPUS/$FUZZ_TARGET" > "$RUNNER_TEMP/fuzz.log" 2>&1
          status=$?
          pkill -f "Diffra.Protocol.Fuzz.dll" || true
          tail -n 80 "$RUNNER_TEMP/fuzz.log"
          exit "$status"

      - name: Summarize and record stats
        if: always()
        env:
          FUZZ_OUTCOME: ${{ steps.fuzz.outcome }}
        run: |
          execs=$(grep 'stat::number_of_executed_units:' "$RUNNER_TEMP/fuzz.log" | awk '{print $2}' | tail -1)
          [ -z "$execs" ] && execs=$(grep -E '^#[0-9]+' "$RUNNER_TEMP/fuzz.log" | tail -1 | sed -E 's/^#([0-9]+).*/\1/')

          exec_per_sec=$(grep 'stat::average_exec_per_sec:' "$RUNNER_TEMP/fuzz.log" | awk '{print $2}' | tail -1)
          [ -z "$exec_per_sec" ] && exec_per_sec=$(grep -oE 'exec/s: [0-9]+' "$RUNNER_TEMP/fuzz.log" | tail -1 | awk '{print $2}')

          # The harness writes a .bin reproducer and a .txt report per finding, so count the
          # reports once each, plus any standalone libFuzzer crash/leak/timeout/oom artifacts.
          harness_findings=$(find "$FUZZ_FINDINGS" -type f -name '*.txt' ! -name 'observation-*' 2>/dev/null | wc -l | tr -d ' ')
          libfuzzer_findings=$(find "$FUZZ_FINDINGS" -type f -name 'libfuzzer-*' 2>/dev/null | wc -l | tr -d ' ')
          findings_count=$((harness_findings + libfuzzer_findings))

          if [ -z "$execs" ] || [ -z "$exec_per_sec" ]; then
            echo "::error::Could not parse fuzz execution statistics from log"
            exit 1
          fi

          mkdir -p metadata
          cat <<EOF > metadata/fuzz-stats-${FUZZ_TARGET}.json
          {
            "target": "$FUZZ_TARGET",
            "executions": $execs,
            "execsPerSecond": $exec_per_sec,
            "findingsCount": $findings_count,
            "status": "$FUZZ_OUTCOME"
          }
          EOF
          cat metadata/fuzz-stats-${FUZZ_TARGET}.json

          {
            echo "## Fuzz: $FUZZ_TARGET (${FUZZ_SECONDS}s)"
            echo
            echo "libFuzzer outcome: $FUZZ_OUTCOME"
            echo "Executions: $execs ($exec_per_sec exec/s)"
            echo "Findings: $findings_count"
            echo
            echo '```text'
            grep -E '^(#[0-9]+.*(DONE|pulse)|stat::|==[0-9]+== ERROR|SUMMARY|INFO: Seed|INFO: .* files found)' "$RUNNER_TEMP/fuzz.log" | tail -n 25 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload findings and corpus
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deep-fuzz-${{ matrix.target }}
          path: |
            .fuzz
            metadata/fuzz-stats-${{ matrix.target }}.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail on findings
        env:
          FUZZ_OUTCOME: ${{ steps.fuzz.outcome }}
        run: |
          crash_files=$(find "$FUZZ_FINDINGS" -type f \( \
            -name 'libfuzzer-crash-*' -o -name 'crash-*' -o \
            -name 'libfuzzer-leak-*' -o -name 'leak-*' -o \
            -name 'libfuzzer-timeout-*' -o -name 'timeout-*' -o \
            -name 'libfuzzer-oom-*' -o -name 'oom-*' -o \
            -name '*.txt' \) ! -name 'observation-*' 2>/dev/null || true)
          if [ "$FUZZ_OUTCOME" != "success" ] || [ -n "$crash_files" ]; then
            echo "::error::Fuzzing found issues for $FUZZ_TARGET; see the job summary and the deep-fuzz-$FUZZ_TARGET artifact."
            exit 1
          fi

  # 4. Mutation testing across all of Protocol (runs on Linux)
  mutation:
    name: mutation (all Protocol)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Build solution
        run: dotnet build Diffra.slnx --configuration Release

      - name: Baseline - run adapter suite unmutated
        run: |
          start=$(date +%s)
          dotnet test tests/Protocol.Tests.Stryker/Protocol.Tests.Stryker.csproj --configuration Release --logger "console;verbosity=normal"
          echo "BASELINE_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Install Stryker.NET
        run: dotnet tool install dotnet-stryker --version 5.0.0 --tool-path "$RUNNER_TEMP/stryker"

      # Full Protocol mutation floor is measured at 57.21% (threshold 57), ratcheting upward over time.
      - name: Run Stryker across all of Protocol
        working-directory: tests/Protocol.Tests.Stryker
        run: |
          start=$(date +%s)
          "$RUNNER_TEMP/stryker/dotnet-stryker" \
            --project Diffra.Protocol.csproj \
            --test-project Protocol.Tests.Stryker.csproj \
            --configuration Release \
            --reporter html --reporter json --reporter progress --reporter cleartext \
            --output "$GITHUB_WORKSPACE/stryker-output" \
            --break-at "$MUTATION_THRESHOLD"
          echo "STRYKER_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Verify hard gates on Comparison and Assessment
        run: |
          report=$(find "$GITHUB_WORKSPACE/stryker-output" -name 'mutation-report.json' | head -1)
          if [ -z "$report" ] || [ ! -f "$report" ]; then
            echo "::error::mutation-report.json not found"
            exit 1
          fi

          comp_score=$(jq -r '.files | to_entries[] | select(.key | endswith("Comparison.cs")) | [.value.mutants[].status] as $s | (($s|map(select(.=="Killed" or .=="Timeout"))|length) * 100 / ($s|map(select(.=="Killed" or .=="Timeout" or .=="Survived" or .=="NoCoverage"))|length))' "$report")
          assess_score=$(jq -r '.files | to_entries[] | select(.key | endswith("Assessment.cs")) | [.value.mutants[].status] as $s | (($s|map(select(.=="Killed" or .=="Timeout"))|length) * 100 / ($s|map(select(.=="Killed" or .=="Timeout" or .=="Survived" or .=="NoCoverage"))|length))' "$report")

          echo "Comparison.cs mutation score: $comp_score %"
          echo "Assessment.cs mutation score: $assess_score %"

          awk -v s="$comp_score" -v f="$COMPONENT_MUTATION_FLOOR" 'BEGIN { if (s == "" || s + 0 < f + 0) { print "::error::Comparison.cs score " s "% is below " f "%"; exit 1 } }'
          awk -v s="$assess_score" -v f="$COMPONENT_MUTATION_FLOOR" 'BEGIN { if (s == "" || s + 0 < f + 0) { print "::error::Assessment.cs score " s "% is below " f "%"; exit 1 } }'

      - name: Summarise
        if: always()
        run: |
          report=$(find "$GITHUB_WORKSPACE/stryker-output" -name 'mutation-report.json' | head -1)
          {
            echo "## Stryker.NET: Full Protocol Scope"
            echo
            echo "Unmutated suite: ${BASELINE_SECONDS:-n/a} s. Stryker: ${STRYKER_SECONDS:-n/a} s."
            echo
            if [ -n "$report" ]; then
              echo "| File | Killed | Survived | Timeout | NoCoverage | Other | Score (covered) | Score (all) |"
              echo "| --- | --- | --- | --- | --- | --- | --- | --- |"
              jq -r '.files | to_entries[] | .key as $f | [.value.mutants[].status] as $s
                | ($s|map(select(.=="Killed"))|length) as $k
                | ($s|map(select(.=="Survived"))|length) as $sv
                | ($s|map(select(.=="Timeout"))|length) as $t
                | ($s|map(select(.=="NoCoverage"))|length) as $n
                | (($s|length) - $k - $sv - $t - $n) as $o
                | "| \($f|split("/")|last) | \($k) | \($sv) | \($t) | \($n) | \($o) | \(if ($k+$t+$sv)>0 then (100*($k+$t)/($k+$t+$sv)|floor) else "n/a" end)% | \(if ($k+$t+$sv+$n)>0 then (100*($k+$t)/($k+$t+$sv+$n)|floor) else "n/a" end)% |"' "$report"
            else
              echo "No mutation-report.json produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deep-stryker-report
          path: stryker-output
          retention-days: 14
          if-no-files-found: warn

  # 5. High-iteration property runs (runs on Linux)
  properties:
    name: properties (100k iterations)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Run high-iteration property and metamorphic checks
        id: properties-run
        run: |
          set -euo pipefail
          mkdir -p metadata temp
          dotnet run --project tests/Protocol.Properties/Protocol.Properties.csproj --configuration Release -- 100000 | tee temp/properties.log

      - name: Record properties metadata
        if: always()
        env:
          PROPERTIES_OUTCOME: ${{ steps.properties-run.outcome }}
        run: |
          mkdir -p metadata
          iterations=$(grep -oE 'Iterations per property: [0-9]+' temp/properties.log 2>/dev/null | awk '{print $NF}' || true)
          checked=$(grep -c -E '^\| .* \| (pass|\*\*FAIL\*\*) \|' temp/properties.log 2>/dev/null || true)
          passed=$(grep -c -E '^\| .* \| pass \|' temp/properties.log 2>/dev/null || true)
          failed=$(grep -c -E '^\| .* \| \*\*FAIL\*\* \|' temp/properties.log 2>/dev/null || true)

          if [ -z "$iterations" ] || [ -z "$checked" ] || [ "$checked" -le 0 ]; then
            echo "::error::Could not parse property check iterations and results from log (format drift)"
            exit 1
          fi

          cat <<EOF > metadata/properties-summary.json
          {
            "status": "$PROPERTIES_OUTCOME",
            "iterations": $iterations,
            "propertiesChecked": $checked,
            "propertiesPassed": $passed,
            "propertiesFailed": $failed
          }
          EOF
          cat metadata/properties-summary.json

      - name: Upload properties summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deep-properties-summary
          path: metadata/properties-summary.json
          if-no-files-found: error

  # 6. Deep summary job
  deep:
    name: deep
    if: always()
    needs: [validate, platform, test, fuzz, mutation, properties]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      result: ${{ steps.aggregate.outputs.result || 'failure' }}
      evidence-verdict: ${{ steps.evidence.outputs.verdict }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full first-parent history, to find the nearest ancestor with main deep Evidence.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Download all deep workflow artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: 'deep-*'
          path: artifacts-summary

      - name: Generate deep summary
        id: summary
        env:
          SCHEMA_VERSION: "1.0.0"
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          # Empty if validate failed; DeepSummary then treats the run as strict and fails it.
          FUZZ_BUDGET_SECONDS: ${{ needs.validate.outputs.fuzz_seconds }}
          FUZZ_TARGET: ${{ needs.validate.outputs.target }}
          STRICT: ${{ needs.validate.outputs.strict }}
          JOB_RESULTS_JSON: ${{ toJson(needs) }}
        run: dotnet run scripts/DeepSummary.cs -- artifacts-summary deep-summary.json

      - name: Upload deep summary artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deep-summary
          path: deep-summary.json
          if-no-files-found: ignore

      # Test strength as Evidence. The summary becomes three Diffra payloads (strength,
      # throughput, size), collected with the pinned judge. A nightly run of this workflow on
      # main records them; the Deep baseline workflow then publishes them to diffra-baselines.
      # Every other run diffs them against the nearest ancestor's main deep Evidence and
      # evaluates them with baselines/deep/*.rules.json. A missing baseline is inconclusive.
      - name: Install pinned Diffra judge
        if: steps.summary.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run scripts/InstallJudge.cs

      - name: Build deep Evidence payloads
        id: payloads
        if: steps.summary.outcome == 'success'
        run: dotnet run scripts/DeepEvidence.cs -- payloads deep-summary.json temp/deep-evidence

      - name: Validate payloads against the committed payload schema
        if: steps.payloads.outcome == 'success'
        env:
          CHECK_JSONSCHEMA: pipx run check-jsonschema==0.29.4
        run: |
          $CHECK_JSONSCHEMA --check-metaschema baselines/deep/payload.schema.json
          $CHECK_JSONSCHEMA --schemafile baselines/deep/payload.schema.json temp/deep-evidence/payload-*.json

      - name: Collect and judge deep Evidence
        id: evidence
        if: steps.payloads.outcome == 'success'
        env:
          COMMIT_SHA: ${{ github.sha }}
          # Record (no judging) only for the nightly run of this repository's own deep.yml on
          # main. A called run's workflow_ref names the caller, so a release or any other
          # caller never records; nor does a dispatch, a branch or a fork.
          DEEP_EVIDENCE_RECORD: ${{ needs.validate.outputs.strict == 'true' && github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.workflow_ref == 'rtkelly-labs/Diffra/.github/workflows/deep.yml@refs/heads/main' }}
        run: dotnet run scripts/DeepEvidence.cs -- evidence temp/deep-evidence

      - name: Upload deep Evidence artifact
        if: always() && steps.payloads.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deep-evidence
          path: |
            temp/deep-evidence/payload-*.json
            temp/deep-evidence/evidence/
            temp/deep-evidence/judge/
            temp/deep-evidence/manifest.json
          if-no-files-found: ignore

      - name: Require every deep-tier job to pass
        id: aggregate
        if: always()
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          EVIDENCE_VERDICT: ${{ steps.evidence.outputs.verdict }}
        run: |
          echo "Deep-tier results: $RESULTS"
          echo "Summary step outcome: $SUMMARY_OUTCOME"
          echo "Evidence step outcome: $EVIDENCE_OUTCOME (verdict: ${EVIDENCE_VERDICT:-none})"
          if [ "$SUMMARY_OUTCOME" != "success" ]; then
            echo "result=failure" >> "$GITHUB_OUTPUT"
            echo "::error::Deep summary generation failed."
            exit 1
          fi
          if [ "$EVIDENCE_OUTCOME" != "success" ]; then
            echo "result=failure" >> "$GITHUB_OUTPUT"
            echo "::error::Deep Evidence could not be collected or judged."
            exit 1
          fi
          if [ "$EVIDENCE_VERDICT" = "fail" ]; then
            echo "result=failure" >> "$GITHUB_OUTPUT"
            echo "::error::Deep test strength regressed against the main baseline (verdict: fail)."
            exit 1
          fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "result=failure" >> "$GITHUB_OUTPUT"
              echo "::error::A deep-tier job finished with '$result'."
              exit 1
            fi
          done
          echo "result=success" >> "$GITHUB_OUTPUT"
