name: Qodana (.NET)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # The build pins the SDK in global.json (10.0.403, for CVE-2026-111497) with rollForward disabled.
      # The Qodana image ships its own .NET 10 SDK and cannot load MSBuild under that pin. The linter
      # produces no build output, so it analyses with the image's SDK instead.
      - name: "Use the Qodana image's SDK"
        run: rm global.json

      # The linter image and solution come from qodana.yaml.
      - name: "Qodana Scan (.NET)"
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        with:
          pr-mode: false

      - name: "Upload SARIF to GitHub Security"
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
