name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compile:
    name: compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Enforce No Python Scripts Policy
        run: |
          echo "Scanning repository for unauthorized Python (.py) files..."
          forbidden_py=$(git ls-files '*.py' | grep -v '^examples/sample-project/' || true)
          if [ -n "$forbidden_py" ]; then
            echo "::error::Unauthorized Python (.py) files found in repository:"
            echo "$forbidden_py"
            echo "All tooling, dogfooding, and automation must be authored in C# (.cs) executed via dotnet run."
            exit 1
          fi
          echo "Policy verified: No unauthorized Python files found."

      - name: Enforce Zero Aspire Dependencies Policy
        run: |
          echo "Verifying zero runtime or compile-time Aspire framework dependencies..."
          aspire_refs=$(git grep -i "Aspire" -- "*.csproj" || true)
          if [ -n "$aspire_refs" ]; then
            echo "::error::Forbidden Aspire dependencies detected in project files:"
            echo "$aspire_refs"
            exit 1
          fi
          echo "Policy verified: Zero Aspire dependencies found."

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Resolve project version
        id: version
        run: |
          version=$(dotnet msbuild src/Cli/Diffra.Cli.csproj -getProperty:Version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "DIFFRA_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build solution
        run: dotnet build Diffra.slnx --configuration Release

      - name: Pack Pre-Release Diffra CLI Tool
        run: dotnet pack src/Cli/Diffra.Cli.csproj --configuration Release -o artifacts/package

      - name: Run protocol and integration test suite
        run: dotnet run --project tests/Protocol.Tests/Protocol.Tests.csproj --configuration Release --no-build

      - name: Audit package vulnerabilities
        run: dotnet list package --vulnerable --include-transitive

      - name: Smoke test installed Diffra CLI tool
        run: |
          dotnet tool install Diffra.Cli --add-source artifacts/package --tool-path runner-bin --version "$DIFFRA_VERSION"
          mkdir -p temp/smoke
          ./runner-bin/diffra collect \
            --payload examples/sample-project/workflow/candidate-payload.json \
            --subject-id example/project --commit 2222222222222222222222222222222222222222 \
            --type-id org.example.metrics --type-version 1.0 \
            --producer-id org.example.fixture --producer-version 1.0 \
            -o temp/smoke/evidence.json
          test $? -eq 0

          ./runner-bin/diffra diff \
            --baseline-ref examples/sample-project/workflow/baseline-reference.json \
            --baseline-evidence examples/sample-project/workflow/baseline-evidence.json \
            --evidence temp/smoke/evidence.json -o temp/smoke/delta.json
          test $? -eq 0

          ./runner-bin/diffra eval \
            --rules examples/sample-project/workflow/rules.json \
            --delta temp/smoke/delta.json -o temp/smoke/assessment.json
          test $? -eq 0

          ./runner-bin/diffra report \
            temp/smoke/delta.json --assessment temp/smoke/assessment.json \
            --baseline-ref examples/sample-project/workflow/baseline-reference.json \
            --format html -o temp/smoke/report.html
          test $? -eq 0

          test -s temp/smoke/evidence.json
          test -s temp/smoke/delta.json
          test -s temp/smoke/assessment.json
          test -s temp/smoke/report.html

      - name: Upload Pre-Release Tool Package Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: diffra-cli-tool
          path: artifacts/package/*.nupkg
          if-no-files-found: error

  schema-fixtures:
    name: schema-fixtures
    runs-on: ubuntu-latest
    env:
      CHECK_JSONSCHEMA: pipx run check-jsonschema==0.29.4
      E: examples/project-file
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check the schemas against the JSON Schema metaschema
        run: |
          $CHECK_JSONSCHEMA --check-metaschema schemas/project-v1.schema.json schemas/collection-v1.schema.json \
            $E/benchmarks/payload.schema.json $E/test-results/payload.schema.json

      - name: Validate the valid fixtures
        run: |
          $CHECK_JSONSCHEMA --schemafile schemas/project-v1.schema.json $E/*/diffra.project.yml
          $CHECK_JSONSCHEMA --schemafile schemas/collection-v1.schema.json $E/benchmarks/collection*.json
          $CHECK_JSONSCHEMA --schemafile $E/benchmarks/payload.schema.json $E/benchmarks/payload.json
          $CHECK_JSONSCHEMA --schemafile $E/test-results/payload.schema.json $E/test-results/payload.json

      - name: Require every invalid fixture to fail validation
        run: |
          status=0
          expect_invalid() {
            if $CHECK_JSONSCHEMA --schemafile "$1" "$2" > /dev/null 2>&1; then
              echo "::error file=$2::$2 passed validation against $1 but must fail"
              status=1
            else
              echo "rejected as expected: $2"
            fi
          }
          for f in $E/invalid/project-*.yml; do expect_invalid schemas/project-v1.schema.json "$f"; done
          for f in $E/invalid/collection-*.json; do expect_invalid schemas/collection-v1.schema.json "$f"; done
          for f in $E/invalid/benchmarks-payload-*.json; do expect_invalid $E/benchmarks/payload.schema.json "$f"; done
          for f in $E/invalid/test-results-payload-*.json; do expect_invalid $E/test-results/payload.schema.json "$f"; done
          count=$(ls $E/invalid | wc -l)
          echo "checked $count invalid fixtures"
          exit $status

  jcs-differential:
    name: jcs-differential
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JCS_DIR: ${{ github.workspace }}/.jcs-run
      JCS_SEED: "20261105"
      JCS_COUNT: "3000"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout RFC 8785 test vectors (cyberphone/json-canonicalization)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cyberphone/json-canonicalization
          ref: 32a48195b9b20fe67b1795e39e4509f14d860b45
          path: .jcs-reference
          sparse-checkout: testdata
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Generate corpus and canonicalize with Diffra
        run: >-
          dotnet run --project tests/CanonicalJson.Differential/CanonicalJson.Differential.csproj --configuration Release --
          prepare --out "$JCS_DIR" --seed "$JCS_SEED" --count "$JCS_COUNT" --vectors .jcs-reference/testdata

      - name: Canonicalize with canonicalize 5.1.0 (npm, JavaScript)
        env:
          NODE_PREFIX: ${{ runner.temp }}/jcs-node
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$NODE_PREFIX" canonicalize@5.1.0
          node --input-type=module -e '
            import fs from "node:fs";
            import path from "node:path";
            import { pathToFileURL } from "node:url";
            const lib = path.join(process.env.NODE_PREFIX, "node_modules/canonicalize/lib/canonicalize.js");
            const { default: canonicalize } = await import(pathToFileURL(lib).href);
            const root = process.env.JCS_DIR;
            const out = path.join(root, "node");
            fs.mkdirSync(out, { recursive: true });
            const decoder = new TextDecoder("utf-8", { fatal: true });
            for (const file of fs.readdirSync(path.join(root, "cases"))) {
              const id = path.basename(file, ".json");
              try {
                const value = JSON.parse(decoder.decode(fs.readFileSync(path.join(root, "cases", file))));
                fs.writeFileSync(path.join(out, id + ".json"), canonicalize(value), "utf8");
              } catch (error) {
                fs.writeFileSync(path.join(out, id + ".err"), String(error && error.message));
              }
            }
          '

      - name: Canonicalize with rfc8785 0.1.4 (PyPI, Python)
        run: |
          uv run --no-project --isolated --with rfc8785==0.1.4 python -c '
          import json, os, pathlib, rfc8785
          root = pathlib.Path(os.environ["JCS_DIR"])
          out = root / "python"
          out.mkdir(exist_ok=True)
          for case in sorted((root / "cases").glob("*.json")):
              try:
                  value = json.loads(case.read_bytes().decode("utf-8"))
                  (out / (case.stem + ".json")).write_bytes(rfc8785.dumps(value))
              except Exception as error:
                  (out / (case.stem + ".err")).write_text(repr(error))
          '

      - name: Compare Diffra with RFC 8785 vectors and reference implementations
        run: >-
          dotnet run --project tests/CanonicalJson.Differential/CanonicalJson.Differential.csproj --configuration Release --no-build --
          compare --out "$JCS_DIR" --references node,python

      - name: Upload differential corpus
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jcs-differential-corpus
          path: .jcs-run
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  properties:
    name: properties
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Run property and metamorphic checks
        run: dotnet run --project tests/Protocol.Properties/Protocol.Properties.csproj --configuration Release -- 2000

  regression-corpus:
    name: regression-corpus
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Build solution
        run: dotnet build Diffra.slnx --configuration Release

      - name: Pack Candidate Diffra CLI Tool
        run: |
          version=$(dotnet msbuild src/Cli/Diffra.Cli.csproj -getProperty:Version)
          dotnet pack src/Cli/Diffra.Cli.csproj --configuration Release -o artifacts/package
          dotnet tool install Diffra.Cli --add-source artifacts/package --tool-path runner-bin --version "$version"

      - name: Run frozen regression corpora against candidate build
        run: dotnet run --project tests/regression/Diffra.Regression.csproj --configuration Release --no-build -- --tool runner-bin/diffra

  dogfood:
    name: dogfood
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install pinned Diffra judge
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run scripts/InstallJudge.cs

      - name: Dogfood Diffra (Self-Evaluation against Baseline Budget)
        run: dotnet run scripts/RunDogfood.cs

      - name: Upload Dogfood Review Bundle Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: diffra-dogfood-bundle
          path: dogfood-run/review-bundle
          if-no-files-found: ignore

  # The required check. It passes only when every shallow-tier job passes, so a new
  # shallow job is added to this list rather than to the repository ruleset.
  build:
    name: build
    if: always()
    needs: [compile, schema-fixtures, jcs-differential, properties, regression-corpus, dogfood]
    runs-on: ubuntu-latest
    steps:
      - name: Require every shallow-tier job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Shallow-tier results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A shallow-tier job finished with '$result'."
              exit 1
            fi
          done

  record-baseline-collect:
    name: record-baseline-collect
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install pinned Diffra judge
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run scripts/InstallJudge.cs

      - name: Collect main baseline evidence
        run: dotnet run scripts/RunDogfood.cs --collect-only

      - name: Validate Candidate Evidence Document
        run: |
          test -s dogfood-run/candidate-evidence.json
          jq -e '.id and .subject.commit and .payload' dogfood-run/candidate-evidence.json > /dev/null

      - name: Upload Candidate Evidence Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-evidence
          path: dogfood-run/candidate-evidence.json
          if-no-files-found: error

  record-baseline-publish:
    name: record-baseline-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [record-baseline-collect]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Candidate Evidence Artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: candidate-evidence
          path: ${{ runner.temp }}/evidence-input

      - name: Publish baseline to diffra-baselines branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: diffra-baselines
        run: |
          set -euo pipefail
          EVIDENCE_FILE="${RUNNER_TEMP}/evidence-input/candidate-evidence.json"
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          WORK_DIR="${RUNNER_TEMP}/diffra-baselines-repo"

          if [ ! -s "$EVIDENCE_FILE" ]; then
            echo "::error::Candidate evidence file is missing or empty at $EVIDENCE_FILE"
            exit 1
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          rm -rf "$WORK_DIR"

          if git ls-remote --exit-code --heads "$REPO_URL" "$BRANCH" > /dev/null 2>&1; then
            echo "Branch $BRANCH exists on remote. Cloning..."
            git clone --branch "$BRANCH" --single-branch --depth 20 "$REPO_URL" "$WORK_DIR"
            cd "$WORK_DIR"
          else
            echo "Branch $BRANCH does not exist on remote. Initializing orphan branch..."
            mkdir -p "$WORK_DIR"
            cd "$WORK_DIR"
            git init -b "$BRANCH"
            git remote add origin "$REPO_URL"
          fi

          mkdir -p evidence
          TARGET_FILE="evidence/${COMMIT_SHA}.json"

          if [ -f "$TARGET_FILE" ]; then
            if cmp -s "$EVIDENCE_FILE" "$TARGET_FILE"; then
              echo "Baseline evidence for $COMMIT_SHA already exists with identical content. Idempotent success."
              exit 0
            else
              echo "::error::Baseline evidence for $COMMIT_SHA already exists with DIFFERENT content. Failing without overwriting."
              exit 1
            fi
          fi

          cp "$EVIDENCE_FILE" "$TARGET_FILE"
          git add "$TARGET_FILE"

          if git diff --staged --quiet; then
            echo "Nothing to commit for $COMMIT_SHA. Idempotent success."
            exit 0
          fi

          git commit -m "baseline: record evidence for ${COMMIT_SHA}"

          MAX_ATTEMPTS=3
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Push attempt $ATTEMPT of $MAX_ATTEMPTS..."
            if git push -u origin "$BRANCH"; then
              echo "Successfully pushed baseline for $COMMIT_SHA to $BRANCH."
              exit 0
            fi

            echo "Push failed on attempt $ATTEMPT. Fetching and rebasing..."
            if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "::error::Exceeded maximum retry attempts pushing to $BRANCH."
              exit 1
            fi

            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            ATTEMPT=$((ATTEMPT + 1))
            sleep 2
          done
