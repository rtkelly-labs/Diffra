name: Regression

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # Nightly at 03:00 UTC
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: regression-suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install pinned Diffra judge
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run scripts/InstallJudge.cs -- --tool-path temp/pinned-bin

      - name: Build solution
        run: dotnet build Diffra.slnx --configuration Release

      - name: Pack Candidate Diffra CLI Tool
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          candidate_version="0.0.1-alpha.1.ci.${RUN_ID}.${RUN_ATTEMPT}"
          dotnet pack src/Cli/Diffra.Cli.csproj --configuration Release -p:Version="$candidate_version" -o temp/candidate-pkg
          dotnet tool install Diffra.Cli --add-source temp/candidate-pkg --tool-path temp/candidate-bin --version "$candidate_version"

      - name: Run regression corpus against candidate build
        run: dotnet run --project tests/regression/Diffra.Regression.csproj --configuration Release --no-build -- --tool temp/candidate-bin/diffra

      # scripts/InstallJudge.cs keeps the verified judge package in .tools-cache/.
      - name: Run old vs new tool comparison against v0.0.1-alpha.1
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          candidate_version="0.0.1-alpha.1.ci.${RUN_ID}.${RUN_ATTEMPT}"
          dotnet run --project tests/regression/Diffra.Regression.csproj --configuration Release --no-build -- --compare --old temp/pinned-bin/diffra --new temp/candidate-bin/diffra --old-pkg .tools-cache/Diffra.Cli.0.0.1-alpha.1.nupkg --new-pkg "temp/candidate-pkg/Diffra.Cli.${candidate_version}.nupkg"
