name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# No workflow-level concurrency on purpose. A called workflow evaluates github.workflow and
# github.ref as the caller's values, so a group here could match regression.yml's own group
# and cancel or block the gate.

# Every job, including the called deep and regression workflows, checks out github.sha: the
# tagged commit for a tag push, or the head of the dispatched ref for a dry run. A dry run
# takes the same path as a tag release up to the publish job, so a green dry run means the
# commit is ready to release.
jobs:
  # Cheap checks first, so a bad tag, missing release notes or a missing corpus fail before the deep tier starts.
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Resolve project version
        id: version
        run: |
          version=$(dotnet msbuild src/Cli/Diffra.Cli.csproj -getProperty:Version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "DIFFRA_VERSION=$version" >> "$GITHUB_ENV"

      - name: Validate tag matches project version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_name="${GITHUB_REF#refs/tags/}"
          expected_tag="v${DIFFRA_VERSION}"
          if [ "$tag_name" != "$expected_tag" ]; then
            echo "::error::Tag '$tag_name' does not match expected version tag '$expected_tag'"
            exit 1
          fi
          echo "Tag '$tag_name' verified against project version '$DIFFRA_VERSION'"

      # A release has release notes, and every earlier release has its frozen regression corpus
      # (see "Releasing Diffra" in docs/artifact-delivery-and-ci.md). A tag push fails without
      # them; a dry run (any dispatch, even on a tag ref) only warns, so a dry run that is green
      # and warning-free means the commit is ready. This release's own corpus is not required:
      # it is generated afterwards from the published package, and the next release checks it.
      - name: Require release notes and the corpora of earlier releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          missing=0
          report() {
            missing=1
            if [ "$GITHUB_EVENT_NAME" = push ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::$1"
            else
              echo "::warning::$1 A tag release fails until it is added."
            fi
          }

          # The same extraction as the publish job, so an empty section fails here too.
          notes=$(awk -v v="## ${DIFFRA_VERSION} " 'index($0, v) == 1 {flag=1; next} /^## /{flag=0} flag' CHANGELOG.md | tr -d '[:space:]')
          if [ -n "$notes" ]; then
            echo "Release notes found for ${DIFFRA_VERSION} in CHANGELOG.md"
          else
            report "No release notes under '## ${DIFFRA_VERSION} ' in CHANGELOG.md."
          fi

          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1000 \
            --json tagName --jq '.[].tagName')
          for tag in $tags; do
            released="${tag#v}"
            [ "$released" = "$DIFFRA_VERSION" ] && continue
            corpus="tests/regression/${released}/manifest.json"
            if [ ! -f "$corpus" ]; then
              report "Release $tag has no regression corpus at tests/regression/${released}/. Generate it from the published package."
            elif ! jq -e '(.Cases | type) == "array" and (.Cases | length) > 0' "$corpus" > /dev/null; then
              report "The regression corpus at $corpus has no cases."
            else
              echo "Regression corpus found for $tag: $corpus"
            fi
          done

          if [ "$missing" -ne 0 ] && [ "$GITHUB_EVENT_NAME" = push ]; then
            exit 1
          fi

  # The deep tier on the commit being released. A called run is always strict: every fuzz
  # target at the strict floor, and the mutation floors that deep.yml enforces.
  deep:
    name: deep
    needs: [preflight]
    permissions:
      contents: read
    uses: ./.github/workflows/deep.yml

  # The regression tier on the commit being released.
  regression:
    name: regression
    needs: [preflight]
    permissions:
      contents: read
    uses: ./.github/workflows/regression.yml

  build:
    name: build-and-package
    needs: [preflight, deep, regression]
    runs-on: ubuntu-latest
    env:
      DIFFRA_VERSION: ${{ needs.preflight.outputs.version }}
    outputs:
      version: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Require a passing deep tier
        env:
          DEEP_RESULT: ${{ needs.deep.outputs.result }}
        run: |
          if [ "$DEEP_RESULT" != "success" ]; then
            echo "::error::The deep tier reported '$DEEP_RESULT', not 'success'."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Pack CLI tool package
        run: |
          mkdir -p artifacts
          dotnet pack src/Cli/Diffra.Cli.csproj --configuration Release -o artifacts

      - name: Publish self-contained single-file archives
        run: |
          rids=("linux-x64" "linux-arm64" "osx-x64" "osx-arm64" "win-x64")

          for rid in "${rids[@]}"; do
            echo "Publishing self-contained single-file for $rid..."
            dist_dir="dist/$rid"
            mkdir -p "$dist_dir"

            dotnet publish src/Cli/Diffra.Cli.csproj \
              --configuration Release \
              -r "$rid" \
              --self-contained true \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:PublishTrimmed=false \
              -p:PublishAot=false \
              -o "$dist_dir"

            cp LICENSE README.md "$dist_dir/"

            if [ "$rid" = "win-x64" ]; then
              cp "$dist_dir/Diffra.Cli.exe" "$dist_dir/diffra.exe"
              archive_name="diffra-${DIFFRA_VERSION}-${rid}.zip"
              (cd "$dist_dir" && zip -9 "../../artifacts/${archive_name}" diffra.exe LICENSE README.md)
            else
              cp "$dist_dir/Diffra.Cli" "$dist_dir/diffra"
              chmod +x "$dist_dir/diffra"
              archive_name="diffra-${DIFFRA_VERSION}-${rid}.tar.gz"
              tar -czf "artifacts/${archive_name}" -C "$dist_dir" diffra LICENSE README.md
            fi
            echo "Created artifacts/${archive_name}"
          done

      - name: Smoke test linux-x64 self-contained binary
        run: |
          archive="artifacts/diffra-${DIFFRA_VERSION}-linux-x64.tar.gz"
          mkdir -p temp/smoke-selfcontained
          tar -xzf "$archive" -C temp/smoke-selfcontained

          # Run with an empty environment so no .NET SDK or runtime is reachable.
          sc() { env -i HOME="$HOME" PATH=/nonexistent "$PWD/temp/smoke-selfcontained/diffra" "$@"; }

          echo "Running --help..."
          sc --help
          test $? -eq 0

          echo "Running file workflow smoke test..."
          mkdir -p temp/smoke-sc-run
          sc collect \
            --payload examples/sample-project/workflow/candidate-payload.json \
            --subject-id example/project --commit 2222222222222222222222222222222222222222 \
            --type-id org.example.metrics --type-version 1.0 \
            --producer-id org.example.fixture --producer-version 1.0 \
            -o temp/smoke-sc-run/evidence.json
          test $? -eq 0

          sc diff \
            --baseline-ref examples/sample-project/workflow/baseline-reference.json \
            --baseline-evidence examples/sample-project/workflow/baseline-evidence.json \
            --evidence temp/smoke-sc-run/evidence.json -o temp/smoke-sc-run/delta.json
          test $? -eq 0

          sc eval \
            --rules examples/sample-project/workflow/rules.json \
            --delta temp/smoke-sc-run/delta.json -o temp/smoke-sc-run/assessment.json
          test $? -eq 0

          sc report \
            temp/smoke-sc-run/delta.json --assessment temp/smoke-sc-run/assessment.json \
            --baseline-ref examples/sample-project/workflow/baseline-reference.json \
            --format html -o temp/smoke-sc-run/report.html
          test $? -eq 0

          test -s temp/smoke-sc-run/evidence.json
          test -s temp/smoke-sc-run/delta.json
          test -s temp/smoke-sc-run/assessment.json
          test -s temp/smoke-sc-run/report.html
          jq -e '.environment.tools == []' temp/smoke-sc-run/evidence.json
          echo "Self-contained smoke test succeeded."

      - name: Write SHA256SUMS checksums
        run: |
          cd artifacts
          sha256sum Diffra.Cli.*.nupkg diffra-*.tar.gz diffra-*.zip > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
          ls -lh

      - name: Upload release assets artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: diffra-release-${{ needs.preflight.outputs.version }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: publish-github-release
    # Only a tag push publishes. A manual dispatch is always a dry run, even on a tag ref.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, deep, regression]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PROJECT_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify tag matches project version
        run: |
          tag_name="${GITHUB_REF#refs/tags/}"
          project_version="$PROJECT_VERSION"
          expected_tag="v${project_version}"
          if [ "$tag_name" != "$expected_tag" ]; then
            echo "::error::Tag '$tag_name' does not match expected version tag '$expected_tag'"
            exit 1
          fi
          echo "Tag '$tag_name' matches project version '$project_version'"

      - name: Download release assets artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: diffra-release-${{ needs.build.outputs.version }}
          path: release-assets

      - name: Extract CHANGELOG notes
        run: |
          project_version="$PROJECT_VERSION"
          awk -v v="## ${project_version} " 'index($0, v) == 1 {flag=1; next} /^## /{flag=0} flag' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No release notes found for version ${project_version} in CHANGELOG.md"
            exit 1
          fi
          echo "Release notes extracted:"
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag_name="${GITHUB_REF#refs/tags/}"
          prerelease=()
          case "$tag_name" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$tag_name" \
            release-assets/* "${prerelease[@]}" \
            --title "$tag_name" \
            --notes-file release-notes.md
