schema: https://diffra.net/schemas/root-file-v1.schema.json
# Invalid: a project maps each dataset to the name of a rule set, or to null.
datasets:
  warnings:
    type: count
    unit: warnings
    from: { payload: "metrics.json" }
    rules:
      default:
        check: { fail: { above: 0 } }
projects:
  main: { datasets: [warnings] }
