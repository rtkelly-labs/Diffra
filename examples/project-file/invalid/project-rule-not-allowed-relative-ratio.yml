schema: https://diffra.dev/schemas/project-v1.schema.json
scope: example/invalid
# Invalid: ratios take absolute thresholds only; a relative change of a ratio misleads.
metrics:
  coverage:
    type: diffra/coverage@1
    from: { cobertura: "coverage.xml" }
    fields:
      lineRate:
        versus:
          fail: { decrease: { above: 5% } }
